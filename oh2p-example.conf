# OH2P 音频专用平台配置示例
# 适用于智能音箱等ARM32位音频设备

# 平台设置
platform = oh2p

# ALSA音频设备
# 常用选项: default, sysdefault, dmixer, hw:0,0, plughw:0,0
audio = dmixer

# 要串流的应用
app = Desktop

# 串流服务器地址（需要修改为实际地址）
address = 10.0.0.14

# 证书存储目录
keydir = /tmp/moonlight/certs

# 音频比特率 (kbps)
# 音频专用模式建议使用较低的比特率
bitrate = 5000

# 帧率设置
# 虽然不处理视频，但会影响音频同步
fps = 30

# 音频配置
# stereo: 立体声 (默认)
# 5.1: 5.1环绕声
# 7.1: 7.1环绕声
# surround = 5.1

# 本地音频播放（在服务器端也播放音频）
# localaudio = true

# 退出后关闭应用
# quitappafter = true

# 仅查看模式（禁用输入）
# viewonly = true

# 调试级别
# 0: 无调试信息
# 1: 详细输出
# 2: 调试输出
# debug = 1
